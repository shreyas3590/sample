<!DOCTYPE html>
<html>
    <head><title>FORMS</title></head>
    <body>
        <fieldset>
        <form action="/register" method="post">
            <label for="name">Name:</label>
            <input type="text" minlength="1" maxlength="8" id="name" name="name" placeholder="Nam likh bevkoof" required><br><br>
            <label for="tusername">Username:</label>
            <input type="text" placeholder="username likh be"><br><br>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" oninput="this.value=this.value.tolowercase()" placeholder="Apna gmail likh"><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password likh be"><br><br>
            <label for="date">Date of birth:</label>
            <input type="datetime-local" id="dob" name="dob"><br><br>
            <label for="address">Address:</label>
            <textarea type="address" id="address" name="addresss" placeholder="address likh apna"></textarea><br><br>
            <label for="radio">Gender :</label>
            <input type="radio" id="g" name="g" required>
            <label for="male">Male</label>
            <input type="radio" id="g" name="g">
            <label for="female">Female</label>
            <input type="radio" id="g" name="g">
            <label for="other">Others</label><br><br>
            <label for="country">Country:</label>
            <select id="country" name="country" required>
            <option value="">Select your country</option>
            <option value="india" selected>India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="canada">Canada</option>
            <option value="australia">Australia</option>
        </select><br /><br />
        <label for="state">State:</label>
        <select id="state" name="state" required>
            <option value="">Select your state</option>
            <option value="telangana">Telangana</option>
            <option value="karnataka" selected>Karnataka</option>
            <option value="tamilnadu">Tamil Nadu</option>
            <option value="delhi">Delhi</option>
        </select><br><br>
        <label for="Age">Age:</label>
        <input type="number" id="Age" name="Age" placeholder="Enter your age (In Years)" min="1" max="100" required><br><br>
        <input type="checkbox" id="terms" name="terms" checked>
        <label for="terms">I agree to the terms and conditions</label><br/><br/>
        <input type="submit" value="submit">
        <input type="reset" value="reset">

    </form>
    <legend>Register karo</legend>
    </fieldset>
    </body>
</html>
